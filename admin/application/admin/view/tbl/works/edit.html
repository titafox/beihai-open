<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Author_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-author_id" data-rule="required" data-source="tbl/ips/index" data-field="nickname" class="form-control selectpage" name="row[author_id]" type="text" value="{$row.author_id|htmlentities}">
        </div>
    </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Typ')}:</label>
    <div class="col-xs-12 col-sm-8">

      <select  id="c-typ" class="form-control selectpicker" name="row[typ]">
        {foreach name="typList" item="vo"}
        <option value="{$key}" {in name="key" value="$row.typ"}selected{/in}>{$vo}</option>
        {/foreach}
      </select>

    </div>
  </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Is_synthetic_material')}:</label>
    <div class="col-xs-12 col-sm-8">

      <select  id="c-is_synthetic_material" class="form-control selectpicker" name="row[is_synthetic_material]">
        {foreach name="smList" item="vo"}
        <option value="{$key}" {in name="key" value="$row.is_synthetic_material"}selected{/in}>{$vo}</option>
        {/foreach}
      </select>

    </div>
  </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Description')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" data-rule="required" class="form-control " rows="5" name="row[description]" cols="50">{$row.description|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Image')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" data-rule="required" class="form-control" size="50" name="row[image]" type="text" value="{$row.image|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-image" class="btn btn-danger faupload" data-input-id="c-image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image" class="btn btn-primary fachoose" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-image"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-image"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Price')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-price" data-rule="required" class="form-control" step="0.01" name="row[price]" type="number" value="{$row.price|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Stock')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-stock" data-rule="required" class="form-control" name="row[stock]" type="number" value="{$row.stock|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Reserved')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-reserved" data-rule="required" class="form-control" name="row[reserved]" type="number" value="{$row.reserved|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Stock_sell')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-stock_sell" class="form-control" name="row[stock_sell]" type="number" value="{$row.stock_sell|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Pub_time')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pub_time" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[pub_time]" type="text" value="{:$row.pub_time?datetime($row.pub_time):''}">
        </div>
    </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Sell_time')}:</label>
    <div class="col-xs-12 col-sm-8">
      <input id="c-sell_time" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[sell_time]" type="text" value="{:$row.sell_time?datetime($row.sell_time):''}">
    </div>
  </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Advance_hour')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-advance_hour" class="form-control" name="row[advance_hour]" type="number" value="{$row.advance_hour|htmlentities}">
        </div>
    </div>
  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Sold_out')}:</label>
    <div class="col-xs-12 col-sm-8">

      <select  id="c-sold_out" class="form-control selectpicker" name="row[sold_out]">
        {foreach name="soldOutList" item="vo"}
        <option value="{$key}" {in name="key" value="$row.sold_out"}selected{/in}>{$vo}</option>
        {/foreach}
      </select>

    </div>
  </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>



    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
