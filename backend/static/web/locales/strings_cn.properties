profile-invitationrules2=2.	被邀請的用戶每購買一個NFT，邀請者可獲得一定量的積分，獲得積分數量=NFT標價*1%*100；
profile-invitationrules3=3.	積分可用於兌換市面上流通的虛擬貨幣（兌換功能後續開放，可兌換的貨幣種類見後續兌換功能支持的虛擬幣種類）；
profile-invitationrules4=4.	持有積分的用戶後續有機會獲得Coltstail平台發行的虛擬貨幣。


