about-title=NFT愛好者之道
about-paragraph1=<h4>## 吶喊</h4><p> NFT藝術品行業充滿了欺騙，各種人使用各種手段收割智商稅，卻沒有一個真正的社區站出來吶喊。 </p>
about-paragraph2=<p>一些垃圾作品為了能賣上高價瘋狂的欺瞞用戶，捏造人設、自奉大師。有些參與其中的藝術家們，也深陷其中，甚至一副多賣，瘋狂消耗人品，不再為自己的德行負責。 </p><p>中心化平台卻為虎作倀，協助於低水平者、偽造者以及欺詐者危害世人。 </p>
about-paragraph3=<p>這使得一個原本由藝術家、工程師、愛好者組成的夢想市場受到了越來越大的挑戰，社區沒有話語權、藝術家沒有話語權、愛好者沒有話語權、工程師也沒有話語權。 </p><p>而真正有情懷的藝術家，卻又因為盜版猖獗，沒有一個社區為其保駕護航。他們只能各自為政，或為他人作嫁衣；程序員們空有技術，卻沒有可以幫助到的群體。 </p>
about-paragraph4=<p>而對於收藏者，其所購買的畫作根本沒有任何價值，只能爛在手裡。大家都在瘋狂，卻沒有真正的找到NFT藝術藏品的最終歸宿。 </p><p>對於工程師來說，由區塊鏈革命帶來的WEB3.0時代，讓其沉迷其中，卻又在NFT不知所以，他們渴望與藝術家們及收藏者們攜手共創。 </p>
about-paragraph5=<h4> ## 我們</h4><p>我們這一群人都是NFT的愛好者，是藝術家、工程師還是收藏者，也是學生、畫師、區塊鏈投資人、農場經營者以及程序員。我們或者很早的發現NFT的魅力，也或者最近剛開始才迷戀上它，也很願意參與其中。但是我們打心底里唾棄欺詐與賭博，我們希望能給予NFT藝術品市場更多的正能力。讓一群有真正藝術創造力的、遵循一個共同的創作原則的社區占主導地位，讓藝術家、工程師以及愛好者們都能有自己的話語權的。當遇到困難的時候，社區會站出來為其吶喊，並且他們的勞動是有正當回報的，而社區又是真正的歸屬於這一群人的。我們希望可以通過社區的不斷運營悉心的教育用戶提升其藝術鑑賞能力，使得NFT藝術藏品行業能夠永續而健康的發展。</p>
about-paragraph6=<h4>## 努力向DAO</h4><p>由藝術家、工程師、愛好者共同組成的小群體們相信，“未來的元宇宙不會屬於某一個人或者某一家公司，而是會由無數社區的藝術家、工程師、愛好者共建共享共有。”</p><p>事實上從 Web2 到 Web3 的轉變改變了收入流，使社區所有權優先於個人所有權。創作者通過發行 NFT來獲利，NFT充當數字媒體所有權。對於貢獻者來說，我們希望提供了一種非傳統的方式來從事大家各自喜歡的工作，並在此過程中以指數級的優勢獲得資產報酬。 </p>
about-paragraph7=<p>這種形式不通過投機行徑來獲取，我們希望通過最基礎的幾個人的，向其它夥伴宣傳我們的思想與理念，傳授加密藝術品如何對他們未來的生活發生根本性的影響來實現。 </p><p>是的，我們會發行社區加密代幣，但是前期我們可能會以NFT持有數量的形式來實現投票權，但是慢慢的我們我們希望使用諸如 Mirror 和 Zora 這樣的工具，建立像 PartyDAO這樣的社區，現在我們正在開始了，一步步的過渡到DAO。 </p>
about-paragraph8=<h4>## 參於其中</h4><p>這篇文章是對那些希望進入NFT行業的人的公開呼籲。很明顯，很多人都希望進入一個真正的NFT世界，公平、公正且透明，我們現在正在規劃一條清晰的途徑來創造他。我們會做一些工具、建立基礎的社區。 </p><p>如果你對我們的呼籲有興趣，請舉手。我們將共同將成為一支不可忽視的力量。 </p>
about-paragraph9=<h4>## 加入規則</h4><p>1.申請的藝術創作者需在社交媒體平臺（Facebook、Twtter、Instagram、抖音、微博、小紅書等）至少擁有2000粉絲，申請時附鏈接；</p><p>2.需有數字藝術作品創作經驗，申請時需提交至少3個數字藝術作品用於審核；</p>
about-paragraph10=<h4>## 作品要求</h4><p>1.作品必須為原創並以數字形式創建；</p><p>2.不得在其它網絡平臺已經交易過的作品；</p><p>3.作品不得涉及非法內容，包括但不限於涉及國家政治話題、侮辱宗教信仰、種族歧視、黃賭毒等敏感話題；</p><p>4.作品在平臺上的交易價格不得低於0.01 ETH。</p>

