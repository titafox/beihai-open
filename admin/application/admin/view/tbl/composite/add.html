<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Description')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-description" class="form-control" name="row[description]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Composite_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-composite_id" data-rule="required" data-source="tbl/works/index" class="form-control selectpage" name="row[composite_id]" type="text" value="">
        </div>
    </div>

  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Material')}：</label>
    <div class="col-xs-12 col-sm-8">
      <dl class="fieldlist" data-name="row[material]">
        <dd>
          <ins>材料</ins>
          <ins>数量</ins>
        </dd>
        <dd>
          <a href="javascript:;" class="btn btn-sm btn-success btn-append"><i class="fa fa-plus"></i> 追加</a>
        </dd>
        <textarea name="row[material]" class="form-control hide" cols="30" rows="5">{"":""}</textarea>
      </dl>
    </div>
  </div>
<!--    <div class="form-group">-->
<!--        <label class="control-label col-xs-12 col-sm-2">{:__('Stock')}:</label>-->
<!--        <div class="col-xs-12 col-sm-8">-->
<!--            <input id="c-stock" data-rule="required" class="form-control" name="row[stock]" type="number">-->

<!--        </div>-->
<!--    </div>-->
<!--    <div class="form-group">-->
<!--        <label class="control-label col-xs-12 col-sm-2">{:__('Remaining_stock')}:</label>-->
<!--        <div class="col-xs-12 col-sm-8">-->
<!--            <input id="c-remaining_stock" data-rule="required" class="form-control" name="row[remaining_stock]" type="number">-->
<!--        </div>-->
<!--    </div>-->

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Failure_rate')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-failure_rate" data-rule="required" class="form-control" name="row[failure_rate]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="1"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
