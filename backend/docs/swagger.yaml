basePath: /api/v1
definitions:
  controllers.OrderForm:
    properties:
      id:
        type: integer
      num:
        type: integer
    required:
    - id
    - num
    type: object
  req.Authentication:
    properties:
      id_card:
        type: string
      name:
        type: string
    type: object
  req.Login:
    properties:
      code:
        type: string
      invitation:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  req.MarketBuyTheNFT:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  req.MarketOffTheNFT:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  req.MarketOnTheNFT:
    properties:
      id:
        type: integer
      price:
        type: number
    required:
    - id
    - price
    type: object
  req.Send:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  req.StartComposite:
    properties:
      ids:
        items:
          type: integer
        type: array
      wid:
        type: integer
    type: object
  req.StartCompositeData:
    properties:
      composite_id:
        type: integer
      data:
        items:
          $ref: '#/definitions/req.StartComposite'
        type: array
    type: object
  req.UpdateAccountInfo:
    properties:
      avatar:
        type: string
      desc:
        type: string
      nickname:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: Coltstail APIs
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Coltstail APIs
  version: "1.0"
paths:
  /account/authentication:
