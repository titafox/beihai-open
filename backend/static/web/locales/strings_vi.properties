about-title=COLTSTAIL CỦA THE DAO
about-paragraph1=<h4>## RÀO THÉT</h4><p>Nghành sản phẩm nghệ thuật NFT tràn đầy sự gian dối, xuất hiện bao loại người sử dụng các hình thức thủ đoạn khác nhau để bắt người dùng đóng “thuế IQ”, nhưng chưa từng có một cộng đồng thật sự nào dám đứng ra chống chọi với chúng.</p>
about-paragraph2=<p>Để tiện cho việc nâng cao giá trị của một số tác phẩm rác rưởi nên họ đã sử dụng những thủ đoạn như lừa dối người dùng, tự đánh bóng hình ảnh, tự xưng làm đại sư của ngành. Có trường hợp về một số nhà nghệ thuật tham gia vào sự gian dối này, rồi ngày càng lún sâu vào những thủ đoạn đó, thậm chí vì muốn sản phẩm bán đắt nên đã làm những điều sai trái với nhân cách, không còn chịu trách nghiệm với đạo đức của bản thân.</p><p>Những sàn trung tâm hóa lại theo xu hướng nối giáo cho giặc, chỉ biết tiếp tay nâng đỡ những tác giả có trình độ thấp, những kẻ mô phỏng hoặc người kẻ gian chuyên đi lừa dối người khác.</p>
about-paragraph3=<p>Điều này khiến cho một thị trường lý tưởng vốn thuộc về những nhà nghê thuật, nhà công trình và những người cuồng nghệ thuật NFT gặp phải điểm trở ngại lớn, dẫn đến hiện trạng cộng động không sở hữu tiếng nói, nhà nghệ thuật không sở hữu tiếng nói, những người cuồng nghệ thuật NFT không sở hữu tiếng nói, kể cả nhà công trình cũng không sở hữu tiếng nói.</p><p>Và những nhà nghệ thuật có tài năng thật sự, lại gặp phải vấn đề bị xâm phạm bản quyền, trong khi đó không hề xuất hiện một cộng đồng nào có thể bảo vệ cho họ.</p>
about-paragraph4=<p>Họ chỉ đành đi theo lối tự ai nấy lo, hoặc chấp nhận số phận làm thuê không công cho người khác; dù cho những nhà lập trình có tay nghề cao như thế nào, cũng không thể giúp ít cho quần thể đó.</p><p>Đối với những nhà sưu tầm, những tác phẩm tranh sưu tầm mà họ cố gắng mua được hầu như không có giá trị thật sự, kết quả là tan nát trong tay người sưu tầm. Mọi người đều trong tình trạng điên rồ, nhưng vẫn chưa thể kiếm được nơi về cuối cùng cho những tác phẩm sưu tầm nghệ thuật NFT. </p>
about-paragraph5=<h4>## chúng tôi</h4><p>Nhóm người chúng tôi đều là những thành phần cuồng NFT, bao gồm nhà nghệ thuật, nhà công trình và nhà sưu tầm, cũng có sự góp phần của học sinh, họa sĩ, nhà đầu tư chuỗi khối, người kinh doanh nông trại và lập trình viên. Có lẽ vì chúng tôi sớm đã nhận thấy được sức hấp dẫn của NFT, hoặc cũng có thể là dạo gần đây chúng tôi mới đắm chìm vào chúng, thế nào đi chăng nữa thì chúng tôi đều hết sức đồng ý tham gia vào chúng. Nhưng giới hạn của chúng tôi vẫn là sự gian dối và cái cờ bạc, chúng tôi chỉ hy vọng trao cho thị trường sản phẩm nghệ thuật NFT nhiều năng lượng tích cực. Để một nhóm cộng động có tài năng sáng tạo thật sự, và tuân theo một quy tắc cùng nhau lập ra có thể đứng ở vị trí chủ đạo, nhằm trao tiếng nói cho nhà nghệ thuật, nhà công trình và những người cuồng nghệ thuật NFT. Khi gặp phải khó khăn, cộng đồng đó sẵn sàng đứng ra chống chọi, sức lao động của họ một khi đã trao ra thì chắc chắn sẽ nhận được hồi báo, và cộng đồng này sẽ thuộc về nhóm người này. Chúng tôi hy vọng thông qua hoạt động liên tục của cộng đồng để chỉ dẫn người dùng trong việc nâng cao khả năng đánh giá nghệ thuật, thúc đẩy nghành sưu tầm tác phẩm nghệ thuật NFT có thể phát triển một cách khỏe mạnh và liên tục.</p>
about-paragraph6=<h4>## Nỗ lực theo con đường DAO</h4><p>Nhóm nhỏ được thành lập bởi nhà nghệ thuật, nhà công trình và những người cuồng nghệ thuật NFT tin rằng, “vũ trũ meta trong tương lai sẽ không thuộc quyền sở hữu của một ai đó hay một công ty nào đó, mà sẽ do những nhà nghệ thuật, nhà công trình và  những người cuồng nghệ thuật NFT của vô số cộng đồng cùng nhau xây dựng cùng nhau chia sẻ cùng nhau sở hữu.”</p><p>Xét về sự thật thì việc biến đổi từ Web2 đến Web3 đã làm thay đổi nguồn thu nhập, khiến quyền sở hữu cộng đồng được ưu tiên hơn quyền sở hữu cá nhân. Tác giả sẽ kiếm lời thông qua việc phát hành NFT, NFT được xem như là quyền sở hữu truyền thông kỹ thuật số. Đối với những người cống hiến, chúng tôi hy vọng cung cấp một phương án độc đáo khác với con đường truyền thống để tất cả mọi người đều có thể làm những công việc mà mình yêu thích, và trong quá trình đó sẽ nhận được tài sản thù lao thông qua ưu thế hàm số mũ.</p>
about-paragraph7=<p>Hình thức này không thể thông qua con đường đầu cơ để có được, chúng tôi hy vọng thông qua những con người cơ bản nhất, tuyên truyền những suy nghĩ và quan niệm của chúng tôi đến với những bạn đồng hành khác, được thực hiện qua việc truyền đạt tác phẩm nghệ thuật mã hóa sẽ tác động cơ bản vào gốc rễ cuộc sống tương lai của họ như thế nào.</p><p>Đúng thế, chúng tôi sẽ phát hành đồng tiền mã hóa, nhưng trong những khoảng thời gian ban đầu chúng tôi sẽ căn cứ vào hình thức số lượng sở hữu NFT để tiến hành bầu phiếu, nhưng về sau này chúng tôi hy vọng sẽ sử dụng được những công cụ như Mirror và Zora, xây dựng một cộng đồng như PartyDAO, chúng tôi xin gửi thông báo với mọi người là chúng tôi chính thức bắt đầu công việc, từng bước chuyển tiếp về DAO.</p>
about-paragraph8=<h4>## Tham gia vào trong đó</h4><p>Bài văn này chính là lời kêu gọi với những ai mong muốn vào nghành NFT. Có thể thấy một cách rõ ràng, đa số người đều mong muốn bản thân mình sẽ đi vào một thế giới NFT thật sự, trong thế giới đó chỉ tồn tại sự công bằng, công chính và minh bạch, hiện nay chúng tôi đang lên kế hoạch vẽ ra một con đường rõ ràng để xây dựng lên nó. Chúng tôi sẽ làm ra một số công cụ, xây dựng cộng đồng có cơ sở hạ tầng. </p><p>Nếu như bạn quan tâm đến lời kêu gọi của chúng tôi, xin hãy giơ tay lên. Chúng ta sẽ cùng nhau trở thành một lực lượng không bao giờ bị xem thường.</p><p>Hy vọng thông qua bài viết này bạn có thể hiểu thêm được một phần về NFT, nếu bạn là một người cuồng NFT, hoan nghệnh bạn tham gia những GROUP thảo luận để chia sẻ nhé.<p>
about-paragraph9=<h4>## QUY ĐỊNH GIA NHẬP</h4><p>1.Tác giả gia nhập sàn để sáng tác tác phẩm cần phải sở hữu ít nhất 2000 lượt theo dõi trên các trang mạng xã hội như (Facebook、Twtter、Instagram、TikTok、weibo、Xiaohongshu…), xin hãy gửi kèm link để đăng kí gia nhập :</p><p>2.Yêu cầu có kinh nghiệm trong lĩnh vực sáng tác tác phẩm nghệ thuật kỹ thuật số, khi đăng kí tham gia vào sàn cần gửi kèm tối thiểu 3 tác phẩm nghệ thuật kỹ thuật số để sàn xét duyệt.</p>
about-paragraph10=<h4>## YÊU CẦU TÁC PHẨM</h4><p>1.Là tác phẩm tự sáng tác và được sáng tác dưới hình thức kỹ thuật số;</p><p>2.Tác phẩm chưa từng tham gia giao dịch ở bất cứ trang mạng nào;</p><p>3.Nghiêm cấm tác phẩm có nội dung bất hợp pháp, bao gồm nhưng không giới hạn trong những vấn đề nhạy cảm như chính trị quốc gia, xúc phạm tôn giáo tín ngưỡng, kì thị chủng tộc, nội dung mang tính khiêu dâm cờ bạc và chất cấm…</p><p>4.Mức giá giao dịch tác phẩm trên sàn không được dưới mức 0.01 ETH.</p>

