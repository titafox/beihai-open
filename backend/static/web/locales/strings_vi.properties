profile-invitationrules1=1.	Người dùng đăng nhập vào sàn coltstail có thể gửi lời mời gia nhập sàn coltstail với những đối tượng khác thông qua trang thông tin NFT và chia sẻ đường link trong trang trung tâm cá nhân, nhằm đổi lấy lợi nhuận khi đối tượng được mời phát sinh giao dịch trong khoảng thời gian dài;
profile-invitationrules2=2.	Những người dùng gia nhập vào sàn thông qua lời mời hễ mua vào một con NFT, người gửi lời mời cũng sẽ nhận được mức tích điểm nhất định, số điểm nhận được = giá niêm yết NFT * 1%*100;
profile-invitationrules3=3.	Điểm tích lũy có thể dùng để đổi thành những loại tiền ảo được sử dụng phổ biến trên thị trường (chức năng đổi tiền sẽ phát hành sau, thể loại tiền được hỗ trợ chuyển đổi có thể tham khảo trong những loại tiền ảo được hỗ trợ chuyển đổi của chức năng đổi tiền được phát hành ở khoảng thời gian sắp tới);
profile-invitationrules4=4.	Những người dùng có điểm tích lũy sau này sẽ có cơ hội nhận được tiền ảo do sàn Coltstail phát hành. 


