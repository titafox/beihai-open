profile-invitationrules1=1.	User of Coltstail could earn member points through inviting other users to join Coltstail via sharing the link of the NFT detail page or personal center, and get benefits from the invited users’ transactions for a long term.
profile-invitationrules2=2.	For each NFT purchased by the invited user, the inviter can get a certain amount of points, the number of points is equal to NFT’s price*1%*100;
profile-invitationrules3=3.	Points can be used to exchange virtual currencies in circulation on the market (the exchange function will be provided later, and announce the types of currencies that can be exchanged).
profile-invitationrules4=4.	Users who hold points will have the opportunity to obtain virtual currency issued by the Coltstail in the future.


