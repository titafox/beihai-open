about-title=The DAO of Coltstail
about-paragraph1=<h4>## What’s is NFT now?</h4><p>The NFT art industry is full of deception. Various people use various methods to harvest IQ taxes, but no real community has come forward to shout.</p>
about-paragraph2=<p>Some rubbish works insanely deceive users in order to sell them at high prices, fabricate characters and act as masters. Some of the artists involved are also deeply involved, even selling more than one pair, consuming their character crazily, and no longer being responsible for their own virtues.</p><p>Centralized platforms do nothing to help low-level people, counterfeiters, and fraudsters harm the world.</p>
about-paragraph3=<p>This makes a dream market composed of artists, engineers, and enthusiasts increasingly challenged. The community has no right to speak, artists have no right to speak, fans have no right to speak, and engineers have no right to speak.</p><p>For artists who are truly sentimental, because of rampant piracy, there is no community to escort them.They can only work on their own, or make wedding dresses for others; programmers have no skills, but there is no group that can help.</p>
about-paragraph4=<p>For collectors, the paintings they buy have no value at all and can only be rotten in their hands. Everyone is crazy, but they haven’t really found the final destination of the NFT art collection.</p><p>For engineers, the WEB3.0 era brought about by the blockchain revolution makes them addicted to it, but they don’t know why in NFT. They are eager to create together with artists and collectors. </p>
about-paragraph5=<h4> ## About us</h4><p>We are all NFT enthusiasts, whether they are artists, engineers or collectors, but also students, painters, blockchain investors, farm operators, and programmers. We either discovered the charm of NFT very early, or just recently became obsessed with it, and we are willing to participate in it. But we spurn fraud and gambling from the bottom of our hearts, and we hope to give the NFT art market more positive capabilities. Let a group of communities that have real artistic creativity and follow a common creative principle dominate, so that artists, engineers and enthusiasts can have their own right to speak. When encountering difficulties, the community will stand up and shout for it, and their labor is legitimately rewarded, and the community truly belongs to this group of people. We hope that through the continuous operation of the community, we can carefully educate users to improve their art appreciation ability, so that the NFT art collection industry can develop in a sustainable and healthy manner.</p>
about-paragraph6=<h4>## Try to get closer to DAO</h4><p>A small group composed of artists, engineers, and enthusiasts believe that “the future meta-universe will not belong to a certain individual or a certain company, but will be built and shared by artists, engineers, and enthusiasts from countless communities.”</p><p>In fact, the transition from Web2 to Web3 changed the income stream, making community ownership take precedence over individual ownership. Creators profit by issuing NFTs, which act as digital media ownership. For contributors, we hope to provide a non-traditional way to engage in the work that everyone likes, and in the process to obtain asset returns with an exponential advantage. </p>
about-paragraph7=<p>This form is not obtained through speculation. We hope that through the most basic people, we can promote our ideas and concepts to other partners, and teach how encrypted artworks will fundamentally affect their future lives.</p><p>Yes, we will issue community encrypted tokens, but in the early stage we may realize voting rights in the form of NFT holdings, but gradually we hope to use tools such as Mirror and Zora to build communities like PartyDAO , Now we are starting, step by step transition to DAO. </p>
about-paragraph8=<h4>## Participate in it</h4><p>This article is a public call for those who wish to enter the NFT industry. Obviously, many people want to enter a real NFT world, fair, just and transparent, and we are now planning a clear way to create him. We will make some tools and build a basic community.</p><p>If you are interested in our appeal, please raise your hand. Together we will become a force that cannot be ignored. </p>
about-paragraph9=<h4>## The Admission rules of coltstail</h4><p>1.Applicants should have at least 2,000 followers on social media platforms (Facebook, Twitter, Instagram, TikTok, Weibo, Little Red Book, etc.), and attach relevant links to the application.</p><p>2.Applicants should have experience in creating digital art works and submit at least 3 digital art works for review. </p>
about-paragraph10=<h4>## The standard of works</h4><p>1.The art work must be original and created in digital form;</p><p>2.It must not be a work that has been traded on other online platforms;</p><p>3.It is forbidden to involving illegal content causing any controversy , including but not limited to politics, religion,racial discrimination, pornography, gambling and drug abuse and other sensitive topics;</p><p>4.The price of works on the platform shall not be less than 0.01 ETH.</p>

