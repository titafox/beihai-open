<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
   <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Snapshot_mod')}:</label>
    <div class="col-xs-12 col-sm-8">

      <select  id="c-snapshot_mod" data-rule="required" class="form-control selectpicker" name="row[snapshot_mod]">
        {foreach name="snapshotModList" item="vo"}
        <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
        {/foreach}
      </select>

    </div>
  </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('A_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-a_id" data-rule="required"  class="form-control" name="row[a_id]" type="text" value="" placeholder="手动模式下,快照作品请与关联作品保持一致">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('B_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-b_id" data-rule="required"  class="form-control" name="row[b_id]" type="text" value="">
        </div>
    </div>


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Whitelist')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-whitelist" class="form-control " rows="5" name="row[whitelist]" cols="50" placeholder="自动模式下，此名单无效，名单格式为：手机号-数量以逗号隔开，例如:13800000000-5,13900000000-3"></textarea>
        </div>
    </div>

  <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Start_time')}:</label>
    <div class="col-xs-12 col-sm-8">
      <input id="c-start_time" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[start_time]" type="text" value="{:date('Y-m-d H:i:s')}">
    </div>
  </div>

<!--    <div class="form-group">-->
<!--        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>-->
<!--        <div class="col-xs-12 col-sm-8">-->
<!--            <input id="c-status" data-rule="required" class="form-control" name="row[status]" type="number" value="0">-->
<!--        </div>-->
<!--    </div>-->
<!--    <div class="form-group">-->
<!--        <label class="control-label col-xs-12 col-sm-2">{:__('Update_time')}:</label>-->
<!--        <div class="col-xs-12 col-sm-8">-->
<!--            <input id="c-update_time" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[update_time]" type="text" value="{:date('Y-m-d H:i:s')}">-->
<!--        </div>-->
<!--    </div>-->
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
